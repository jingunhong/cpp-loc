[project]
name = "cpp-loc"
version = "0.1.0"
description = "Temporally controlled code localization instances mined from large C/C++ repositories"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jingun Hong", email = "jingun.hong@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cpp_loc"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
